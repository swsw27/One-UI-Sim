<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>One UI Sim</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lockscreen.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <main id="device" class="locked">
        <div id="status-bar">
            <span id="status-time">--:--</span>
            <div class="status-icons"><span>●</span><span>Wi-Fi</span><span>▰</span></div>
        </div>

        <section id="lock-screen" class="screen active">
            <div class="lock-content">
                <div id="lock-date"></div>
                <div id="lock-clock">--:--</div>
                <div class="lock-message">화면을 쓸어서 잠금 해제</div>
            </div>
            <div class="lock-shortcuts">
                <button class="shortcut" aria-label="전화">☎</button>
                <button class="shortcut" aria-label="카메라">📷</button>
            </div>
        </section>

                <section id="home-screen" class="screen">
            <div class="widget clock-widget">
                <div id="home-clock">--:--</div>
                <div id="home-date"></div>
            </div>

            <div class="app-grid">
                <button class="app-icon"><div class="icon settings-icon"><svg viewBox="0 0 24 24"><g fill="white"><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="6.5"/></g><circle cx="12" cy="12" r="2.6" fill="#2b2231"/></svg></div><span>설정</span></button>
                <button class="app-icon"><div class="icon gallery-icon"><svg viewBox="0 0 24 24"><g fill="white"><circle cx="12" cy="7" r="4" transform="rotate(0 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(72 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(144 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(216 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2.2" fill="rgba(0,0,0,0.25)"/></svg></div><span>갤러리</span></button>
                <button class="app-icon"><div class="icon calculator-icon">▦</div><span>계산기</span></button>
                <button class="app-icon"><div class="icon clock-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#2a2a33" stroke-width="1.6"/><g class="hand-hour" transform="rotate(0 12 12)"><line x1="12" y1="12" x2="12" y2="7" stroke="#2a2a33" stroke-width="2" stroke-linecap="round"/></g><g class="hand-minute" transform="rotate(0 12 12)"><line x1="12" y1="12" x2="12" y2="4.5" stroke="#2a2a33" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="12" cy="12" r="1.2" fill="#2a2a33"/></svg></div><span>시계</span></button>
                <button class="app-icon"><div class="icon internet-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="white"/><ellipse cx="12" cy="12" rx="10" ry="3" fill="none" stroke="white" stroke-width="1.6" transform="rotate(-20 12 12)"/></svg></div><span>인터넷</span></button>
                <button class="app-icon"><div class="icon games-icon">🎮</div><span>술래잡기</span></button>
            </div>

            <div class="page-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="dock">
                <div class="dock-icon phone-icon">☎</div>
                <div class="dock-icon internet-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="white"/><ellipse cx="12" cy="12" rx="10" ry="3" fill="none" stroke="white" stroke-width="1.6" transform="rotate(-20 12 12)"/></svg></div>
                <div class="dock-icon">▣</div>
                <div class="dock-icon settings-icon"><svg viewBox="0 0 24 24"><g fill="white"><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="6.5"/></g><circle cx="12" cy="12" r="2.6" fill="#2b2231"/></svg></div>
            </div>

            <button id="app-drawer-button" aria-label="앱 서랍 열기">⌃</button>

            <div id="app-drawer">
                <div class="drawer-header">
                    <h2>앱</h2>
                    <button id="close-drawer" aria-label="앱 서랍 닫기">✕</button>
                </div>
                <input type="search" id="app-search" placeholder="앱 검색">
                <div class="drawer-grid">
                    <div class="drawer-app"><div class="icon settings-icon"><svg viewBox="0 0 24 24"><g fill="white"><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.25" y="1.5" width="3.5" height="5" rx="1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="6.5"/></g><circle cx="12" cy="12" r="2.6" fill="#2b2231"/></svg></div><span>설정</span></div>
                    <div class="drawer-app"><div class="icon gallery-icon"><svg viewBox="0 0 24 24"><g fill="white"><circle cx="12" cy="7" r="4" transform="rotate(0 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(72 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(144 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(216 12 12)"/><circle cx="12" cy="7" r="4" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2.2" fill="rgba(0,0,0,0.25)"/></svg></div><span>갤러리</span></div>
                    <div class="drawer-app"><div class="icon calculator-icon">▦</div><span>계산기</span></div>
                    <div class="drawer-app"><div class="icon clock-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#2a2a33" stroke-width="1.6"/><g class="hand-hour" transform="rotate(0 12 12)"><line x1="12" y1="12" x2="12" y2="7" stroke="#2a2a33" stroke-width="2" stroke-linecap="round"/></g><g class="hand-minute" transform="rotate(0 12 12)"><line x1="12" y1="12" x2="12" y2="4.5" stroke="#2a2a33" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="12" cy="12" r="1.2" fill="#2a2a33"/></svg></div><span>시계</span></div>
                    <div class="drawer-app"><div class="icon internet-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="white"/><ellipse cx="12" cy="12" rx="10" ry="3" fill="none" stroke="white" stroke-width="1.6" transform="rotate(-20 12 12)"/></svg></div><span>인터넷</span></div>
                    <div class="drawer-app"><div class="icon games-icon">🎮</div><span>술래잡기</span></div>
                </div>
            </div>
        </section>

        <nav id="navigation-bar">
            <button class="nav-button" id="nav-recents" aria-label="최근 앱">
                <svg viewBox="0 0 24 24"><path d="M7 6v12M12 6v12M17 6v12"/></svg>
            </button>
            <button class="nav-button" id="nav-home" aria-label="홈">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
            </button>
            <button class="nav-button" id="nav-back" aria-label="뒤로">
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
        </nav>
    </main>

    <script src="js/clock.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
