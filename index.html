<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>One UI Sim</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lockscreen.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <main id="device" class="locked">
        <div id="status-bar">
            <span id="status-time">--:--</span>
            <div class="status-icons"><span>●</span><span>Wi-Fi</span><span>▰</span></div>
        </div>

        <section id="lock-screen" class="screen active">
            <div class="lock-content">
                <div id="lock-date"></div>
                <div id="lock-clock">--:--</div>
                <div class="lock-message">화면을 쓸어서 잠금 해제</div>
            </div>
            <div class="lock-shortcuts">
                <button class="shortcut" aria-label="전화">☎</button>
                <button class="shortcut" aria-label="카메라">📷</button>
            </div>
        </section>

                <section id="home-screen" class="screen">
            <div class="home-notice">
                <div class="notice-icon">🔔</div>
                <div class="notice-text">
                    <strong>오늘의 알림</strong>
                    <span>알림 카드 영역</span>
                </div>
            </div>

            <div class="home-widgets">
                <div class="widget clock-widget">
                    <div id="home-clock">--:--</div>
                    <div id="home-date"></div>
                </div>
                <div class="widget pill-widget">
                    <span class="pill-label">메모</span>
                </div>
                <div class="widget pill-widget">
                    <span class="pill-label">날씨</span>
                    <strong>--°</strong>
                </div>
            </div>

            <div class="health-row">
                <div class="health-chip"><span class="chip-value">--</span><span>배터리</span></div>
                <div class="health-chip"><span class="chip-value">--</span><span>걸음</span></div>
                <div class="health-chip"><span class="chip-value">--</span><span>수면</span></div>
                <div class="health-chip"><span class="chip-value">--</span><span>심박</span></div>
            </div>

            <div class="app-grid">
                <button class="app-icon"><div class="icon settings-icon">⚙</div><span>설정</span></button>
                <button class="app-icon"><div class="icon gallery-icon">▧</div><span>갤러리</span></button>
                <button class="app-icon"><div class="icon calculator-icon">▦</div><span>계산기</span></button>
                <button class="app-icon"><div class="icon clock-icon">◷</div><span>시계</span></button>
                <button class="app-icon"><div class="icon internet-icon">◎</div><span>인터넷</span></button>
                <button class="app-icon"><div class="icon games-icon">🎮</div><span>술래잡기</span></button>
            </div>

            <div class="page-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="dock">
                <div class="dock-icon">☎</div>
                <div class="dock-icon">◎</div>
                <div class="dock-icon">▣</div>
                <div class="dock-icon">⚙</div>
            </div>

            <button id="app-drawer-button" aria-label="앱 서랍 열기">⌃</button>

            <div id="app-drawer">
                <div class="drawer-header">
                    <h2>앱</h2>
                    <button id="close-drawer" aria-label="앱 서랍 닫기">✕</button>
                </div>
                <input type="search" id="app-search" placeholder="앱 검색">
                <div class="drawer-grid">
                    <div class="drawer-app">⚙<span>설정</span></div>
                    <div class="drawer-app">▧<span>갤러리</span></div>
                    <div class="drawer-app">▦<span>계산기</span></div>
                    <div class="drawer-app">◷<span>시계</span></div>
                    <div class="drawer-app">◎<span>인터넷</span></div>
                    <div class="drawer-app">🎮<span>술래잡기</span></div>
                </div>
            </div>
        </section>

        <nav id="navigation-bar">
            <button class="nav-button" id="nav-recents" aria-label="최근 앱">
                <svg viewBox="0 0 24 24"><path d="M7 6v12M12 6v12M17 6v12"/></svg>
            </button>
            <button class="nav-button" id="nav-home" aria-label="홈">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
            </button>
            <button class="nav-button" id="nav-back" aria-label="뒤로">
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
        </nav>
    </main>

    <script src="js/clock.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
